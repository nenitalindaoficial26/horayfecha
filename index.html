<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Minimal Slider Widget</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="widget-container">
        <!-- BOTÓN DE AJUSTES (Sutil) -->
        <button id="openSettings" class="settings-trigger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <div class="slider-wrapper" id="slider">
            <!-- CARD 1: RELOJ & FECHA -->
            <div class="card card-time">
                <div class="clock-section">
                    <h1 id="time">00:00</h1>
                    <p id="date">Jueves, 14 de mayo</p>
                </div>
                <div class="footer-section">
                    <div class="moon-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                        </svg>
                    </div>
                    <span id="moonPhaseName" class="user-name-display">Luna Llena</span>
                </div>
            </div>

            <!-- CARD 2: CALENDAR -->
            <div class="card card-calendar">
                <div class="calendar-header">
                    <button id="prevMonth">&lt;</button>
                    <span id="monthName">Mayo</span>
                    <button id="nextMonth">&gt;</button>
                </div>
                <div class="calendar-body">
                    <div class="weekdays" id="weekdaysRow">
                        <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
                    </div>
                    <div class="days-grid" id="daysGrid"></div>
                </div>
            </div>
        </div>

        <!-- MODAL DE AJUSTES -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Personalizar</h2>
                    <button id="closeSettings">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="setting-item">
                        <label>Idioma</label>
                        <select id="langSelect">
                            <option value="es">Español</option>
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Color de Acento</label>
                        <div class="color-picker">
                            <button class="color-dot active" style="background: #ff8fb1;" data-color="#ff8fb1"></button>
                            <button class="color-dot" style="background: #a2d2ff;" data-color="#a2d2ff"></button>
                            <button class="color-dot" style="background: #bde0fe;" data-color="#bde0fe"></button>
                            <button class="color-dot" style="background: #cdb4db;" data-color="#cdb4db"></button>
                            <button class="color-dot" style="background: #fdf0d5;" data-color="#fdf0d5"></button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Fuente</label>
                        <select id="fontSelect">
                            <option value="'Outfit', sans-serif">Outfit (Moderno)</option>
                            <option value="'Playfair Display', serif">Playfair (Elegante)</option>
                            <option value="'Montserrat', sans-serif">Montserrat (Limpio)</option>
                            <option value="'Lora', serif">Lora (Sofisticado)</option>
                            <option value="'Quicksand', sans-serif">Quicksand (Suave)</option>
                            <option value="'Courier New', Courier, monospace">Mono (Minimal)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGINACIÓN -->
        <div class="pagination">
            <span class="dot active" data-index="0"></span>
            <span class="dot" data-index="1"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
