<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Aesthetic Widget</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="perspective-container">
        <div class="widget-wrapper" id="main-widget">
            <!-- Lado Izquierdo: Enfoque -->
            <div class="section left-focus">
                <div class="time-container">
                    <div id="time-display">00:00</div>
                    <div class="date-weather">
                        <span id="full-date">Thursday, April 16</span>
                        <div id="weather-icon-container">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                        </div>
                    </div>
                </div>
                <div class="task-container">
                    <span class="label">Tarea Principal</span>
                    <input type="text" id="main-task" placeholder="¿Qué harás hoy?" maxlength="30">
                </div>
            </div>

            <!-- Lado Derecho: Contexto -->
            <div class="section right-context">
                <div class="calendar-mini">
                    <div id="month-header">ABRIL</div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>
                
                <div class="bottom-controls">
                    <div class="progress-section">
                        <div class="progress-circle-container">
                            <svg class="progress-ring" width="60" height="60">
                                <circle class="progress-ring__circle-bg" stroke="currentColor" stroke-width="4" fill="transparent" r="26" cx="30" cy="30"/>
                                <circle class="progress-ring__circle" stroke="currentColor" stroke-width="4" fill="transparent" r="26" cx="30" cy="30"/>
                            </svg>
                            <div id="progress-text">0%</div>
                        </div>
                    </div>
                    <div class="quick-actions">
                        <button id="btn-lang" title="Cambiar Idioma">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                        </button>
                        <button id="btn-settings" title="Configuración">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Configuración -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajustes Premium</h2>
                <button id="close-modal"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
            </div>
            <div class="modal-body scrollable">
                <div class="setting-item">
                    <label>Nombre del Propietario</label>
                    <input type="text" id="owner-name" placeholder="Ej: Nenita">
                </div>
                
                <div class="setting-item">
                    <label>Formato de Hora</label>
                    <select id="time-format">
                        <option value="24h">24 Horas</option>
                        <option value="12h">12 Horas</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label>Color de Acento (General)</label>
                    <input type="color" id="accent-color-picker" value="#fbc6d0">
                </div>

                <div class="setting-item">
                    <label>Color de Texto (Tarea Principal)</label>
                    <select id="task-text-color">
                        <option value="#ffffff">Blanco</option>
                        <option value="#5d5d5d">Gris Oscuro</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label>Color de Fondo del Widget</label>
                    <input type="color" id="bg-color-picker" value="#ffffff">
                </div>

                <div class="setting-item row">
                    <label>Modo Oscuro</label>
                    <input type="checkbox" id="dark-mode-toggle">
                </div>

                <div class="setting-item">
                    <label>Opacidad del Cristal</label>
                    <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.9">
                </div>
                <div class="setting-item">
                    <label>Efecto 3D (Intensidad)</label>
                    <input type="range" id="tilt-intensity" min="0" max="30" value="15">
                </div>
                <div class="setting-item">
                    <label>Fuente Principal</label>
                    <select id="font-select">
                        <option value="'Playfair Display', serif">Elegante (Playfair)</option>
                        <option value="'Outfit', sans-serif">Moderno (Outfit)</option>
                        <option value="'Dancing Script', cursive">Artístico (Dancing)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Visibilidad Clima</label>
                    <input type="checkbox" id="show-weather" checked>
                </div>
                <div class="setting-item">
                    <label>Visibilidad Progreso</label>
                    <input type="checkbox" id="show-progress" checked>
                </div>
            </div>
            <div class="modal-footer">
                <button id="reset-settings" class="btn-secondary">Restablecer</button>
                <button id="save-settings" class="btn-primary">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
